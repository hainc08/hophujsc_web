# Dựng landing page và đưa bản xem trước lên GitHub Pages mỗi khi push lên main.
# Bản này luôn noindex (không có cờ --index), không thay thế website hopphujsc.com.
name: Deploy preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build
        run: node build.mjs --target=pages --base=${{ github.event.repository.name }}
      - name: Check pages
        run: |
          find dist -name '*.html' | xargs python3 .claude/skills/hopphu-web-design/scripts/check_page.py > check.log || (grep -B2 FAIL check.log; exit 1)
          python3 .claude/skills/hopphu-web-design/scripts/check_links.py dist /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
